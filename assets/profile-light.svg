      <stop offset="0.48" stop-color="#f6fff8"/>
      <stop offset="1" stop-color="#ffffff"/>
    </radialGradient>
    <linearGradient id="matrix" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39ff88"><animate attributeName="stop-color" values="#39ff88;#00ff66;#7cffb2;#39ff88" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="0.55" stop-color="#00ff66"><animate attributeName="stop-color" values="#00ff66;#00c853;#39ff88;#00ff66" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#00c853"/>
